<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WiFi Casa - QR</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #4e54c8, #8f94fb);
      color: #333;
    }

    .card {
      background: #fff;
      padding: 3rem;
      border-radius: 25px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.4);
      text-align: center;
      max-width: 500px;
      width: 90%;
    }

    h1 {
      margin-bottom: 2rem;
      font-size: 2.2rem;
    }

    img {
      width: 350px;
      height: 350px;
      margin-bottom: 2rem;
    }

    .wifi-info {
      background: #f5f5f5;
      padding: 1.2rem 2rem;
      border-radius: 12px;
      font-size: 1.3rem;
      word-wrap: break-word;
      margin-bottom: 1.5rem;
    }

    .instructions {
      background: #eef0ff;
      padding: 1rem 1.5rem;
      border-radius: 12px;
      font-size: 1.1rem;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }

    button {
      background: #4e54c8;
      color: white;
      border: none;
      padding: 1rem 2rem;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1.3rem;
      transition: 0.3s;
    }

    button:hover {
      background: #3b3fc1;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Conéctate al WiFi de casa</h1>
    
    <img src="https://api.qrserver.com/v1/create-qr-code/?data=WIFI:T:WPA;S:REDWIFI_Tdt7;P:Ron.Whisky.Vino_invita2;;&size=350x350" alt="QR WiFi">
    
    <div class="wifi-info" id="wifiText">
      SSID: REDWIFI_Tdt7<br>
      Clave: Ron.Whisky.Vino_invita2
    </div>
    
    <div class="instructions">
      Para iPhone: Mantén presionado el QR y selecciona "Abrir enlace" o "Acceder a red" según la opción que aparezca.  
      En Android: solo escanea y se conectará automáticamente.
    </div>
    
    <button onclick="copyWifi()">Copiar información de WiFi</button>
  </div>

  <script>
    function copyWifi() {
      const text = document.getElementById('wifiText').innerText;
      navigator.clipboard.writeText(text)
        .then(() => alert('Información de WiFi copiada al portapapeles!'))
        .catch(err => alert('Error al copiar'));
    }
  </script>

</body>
</html>
