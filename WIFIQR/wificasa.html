<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WiFi Casa - QR</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #4e54c8, #8f94fb);
    }

    .card {
      background: #fff;
      padding: 3rem;
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.4);
      text-align: center;
      max-width: 400px;
      width: 95%;
    }

    h1 {
      margin-bottom: 2rem;
      color: #333;
      font-size: 2rem;
    }

    img {
      width: 300px;
      height: 300px;
      margin-bottom: 2rem;
    }

    .wifi-info {
      background: #f5f5f5;
      padding: 1rem 1.5rem;
      border-radius: 10px;
      font-size: 1.2rem;
      word-wrap: break-word;
      margin-bottom: 2rem;
    }

    button {
      background: #4e54c8;
      color: white;
      border: none;
      padding: 0.8rem 1.5rem;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1.2rem;
      transition: 0.3s;
    }

    button:hover {
      background: #3b3fc1;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Conéctate al WiFi de casa</h1>
    <img src="https://api.qrserver.com/v1/create-qr-code/?data=WIFI:T:WPA;S:REDWIFI_Tdt7;P:Ron.Whisky.Vino_invita2;;&size=300x300" alt="QR WiFi">
    
    <div class="wifi-info" id="wifiText">SSID: REDWIFI_Tdt7 | Clave: Ron.Whisky.Vino_invita2</div>
    
    <button onclick="copyWifi()">Copiar contraseña</button>
  </div>

  <script>
    function copyWifi() {
      const text = document.getElementById('wifiText').innerText;
      navigator.clipboard.writeText(text)
        .then(() => alert('WiFi copiado al portapapeles!'))
        .catch(err => alert('Error al copiar'));
    }
  </script>

</body>
</html>
